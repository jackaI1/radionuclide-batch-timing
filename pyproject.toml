[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radionuclide-batch-timing"
version = "0.1.0"
description = "Educational radioactive decay and batch deadline simulator"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pint>=0.24,<1", "mpmath>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "scipy>=1.14,<2"]

[project.scripts]
radionuclide-batch = "batch_timing.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/batch_timing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
